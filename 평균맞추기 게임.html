<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평균 맞추기 게임</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Pretendard-Regular';
            src: url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');
            font-weight: 400;
        }
        body { font-family: 'Pretendard', 'Pretendard-Regular', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .calc-btn:active { transform: scale(0.95); }

        /* ===== 결과 공개 카운트다운 ===== */
        .countdown-overlay {
            position: fixed; inset: 0; z-index: 90;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(15, 23, 42, .88);
            backdrop-filter: blur(4px);
            animation: fadeIn .25s ease-out;
        }
        .countdown-label { color: #ffe36e; font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 1rem; }
        .countdown-num {
            color: #fff; font-weight: 900; line-height: 1;
            font-size: clamp(10rem, 38vw, 22rem);
            text-shadow: 0 10px 40px rgba(37, 84, 199, .6);
            animation: countPop 1s ease-out both;
        }
        @keyframes countPop {
            0%   { transform: scale(1.8); opacity: 0; }
            20%  { transform: scale(1);   opacity: 1; }
            80%  { transform: scale(.92); opacity: 1; }
            100% { transform: scale(.6);  opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) { .countdown-num { animation: none; } }

        /* ===== 형성평가 ===== */
        .btn-quiz { background: var(--highlight); color: var(--ink); border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
        .btn-quiz:hover { background: #ffd93d; }
        .qcard { background: #fff; border-radius: 16px; padding: 1.5rem; box-shadow: 0 1px 0 rgba(30,42,68,.06), 0 12px 28px -14px rgba(30,42,68,.25); border-left: 5px solid var(--blue-ink); }
        .qno { width: 2.25rem; height: 2.25rem; border-radius: 9999px; background: var(--ink); color: #fff; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .qtag { background: rgba(37,84,199,.1); color: var(--blue-ink); font-weight: 800; font-size: .85rem; padding: .2rem .65rem; border-radius: 9999px; }
        .qchip { font-family: 'Nanum Pen Script', cursive; font-size: 2rem; line-height: 1; min-width: 3rem; padding: .35rem .6rem; text-align: center; background: #f6f3ea; border: 1.5px solid rgba(30,42,68,.12); border-radius: 10px; color: var(--ink); }
        .qinput { padding: .85rem 1rem; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 1.4rem; font-weight: 800; text-align: center; color: var(--blue-ink); background: #fff; }
        .qinput:focus { outline: none; border-color: var(--blue-ink); box-shadow: 0 0 0 4px rgba(37,84,199,.15); }
        .qinput:disabled { background: #f1f5f9; color: #475569; }
        .qnone { padding: .85rem 1.1rem; border-radius: 12px; border: 2px dashed #94a3b8; color: #475569; font-weight: 800; white-space: nowrap; background: #fff; }
        .qnone-on { border-style: solid; border-color: var(--red-pen); background: rgba(217,71,59,.08); color: var(--red-pen); }
        .qhit { background: linear-gradient(transparent 50%, var(--highlight) 50%); font-weight: 900; padding: 0 .15em; }
        .qscore { background: #fff; border-radius: 16px; padding: 2rem; text-align: center; margin-bottom: 1.5rem; box-shadow: 0 24px 48px -20px rgba(30,42,68,.3); }

        /* ===== 첫 화면: 수학 교실 테마 ===== */
        :root {
            --paper: #fbf8f1;
            --grid: rgba(37, 84, 199, 0.08);
            --grid-strong: rgba(37, 84, 199, 0.16);
            --ink: #1e2a44;
            --blue-ink: #2554c7;
            --red-pen: #d9473b;
            --highlight: #ffe36e;
        }
        .main-stage { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        .grid-bg {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
            background-color: var(--paper);
            background-image:
                linear-gradient(var(--grid-strong) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
        }
        .fnum {
            position: absolute; top: 0;
            font-family: 'Nanum Pen Script', cursive;
            line-height: 1; user-select: none;
            animation: floatUp linear infinite;
            will-change: transform;
        }
        @keyframes floatUp {
            from { transform: translateY(105vh) rotate(-10deg); }
            to   { transform: translateY(-15vh) rotate(10deg); }
        }
        @media (max-width: 640px) { .fnum:nth-child(n+15) { display: none; } }
        @media (prefers-reduced-motion: reduce) {
            .fnum { animation: none; top: var(--y); }
        }
        .paper-card {
            position: relative; z-index: 10;
            width: 100%; max-width: 30rem;
            background: #ffffff;
            border-radius: 6px;
            padding: 3rem 3rem 2.5rem 3.25rem;
            text-align: center;
            box-shadow: 0 1px 0 rgba(30,42,68,.06), 0 24px 48px -12px rgba(30,42,68,.22);
        }
        .paper-card::before {
            content: ""; position: absolute; top: 0; bottom: 0; left: 1.75rem;
            width: 2px; background: rgba(217, 71, 59, .45);
        }
        .tape {
            position: absolute; top: -14px; left: 50%;
            width: 120px; height: 30px;
            transform: translateX(-50%) rotate(-3deg);
            background: rgba(255, 227, 110, .75);
            box-shadow: 0 1px 2px rgba(0,0,0,.08);
        }
        .hand-note {
            font-family: 'Nanum Pen Script', cursive;
            color: var(--red-pen); font-size: 1.9rem; line-height: 1;
            transform: rotate(-4deg); display: inline-block; margin-bottom: .5rem;
        }
        .main-title {
            color: var(--ink); font-weight: 800; letter-spacing: -0.03em;
            font-size: clamp(2.25rem, 7vw, 3rem); line-height: 1.15; word-break: keep-all;
        }
        .hl { background: linear-gradient(transparent 55%, var(--highlight) 55%, var(--highlight) 92%, transparent 92%); padding: 0 .1em; }
        .formula { color: #5b6478; font-size: 1.15rem; margin: 1.1rem 0 1rem; }
        .rule-chip {
            display: inline-flex; align-items: center; gap: .5rem;
            margin-bottom: 2.25rem; padding: .45rem .9rem;
            border: 2px dashed rgba(217, 71, 59, .55); border-radius: 10px;
            color: var(--ink); font-size: 1.05rem; font-weight: 700;
            background: rgba(217, 71, 59, .05);
        }
        .rule-num { font-family: 'Nanum Pen Script', cursive; color: var(--red-pen); font-size: 1.6rem; line-height: 1; font-weight: 400; }
        .btn-main {
            display: flex; align-items: center; justify-content: center; gap: .75rem;
            width: 100%; padding: 1.1rem 1rem; border-radius: 14px;
            font-size: 1.25rem; font-weight: 800;
            transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease;
        }
        .btn-main:hover { transform: translateY(-2px); }
        .btn-main:active { transform: translateY(0); }
        .btn-main:focus-visible { outline: 3px solid var(--highlight); outline-offset: 3px; }
        .btn-teacher { background: #fff; color: var(--ink); border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
        .btn-teacher:hover { background: #f4f6fb; }
        .btn-student { background: var(--blue-ink); color: #fff; border: 2px solid var(--blue-ink); box-shadow: 0 4px 0 #173a94; }
        .btn-student:hover { background: #1f49b3; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 메인 앱 컨테이너 -->
    <div id="app" class="flex-grow flex flex-col relative w-full h-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8"></div>

    <!-- 토스트 알림창 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-8 py-4 rounded-full shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-xl font-bold text-center w-max max-w-[90vw]">
        알림 메시지
    </div>

    <!-- 교사 비밀번호 입력 모달 -->
    <div id="pwModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 fade-in">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">관리자 비밀번호</h2>
            <input type="text" id="pwInput" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full px-4 py-4 border-2 border-gray-300 rounded-xl mb-8 text-center text-3xl tracking-[0.5em] focus:ring-4 focus:ring-blue-200 focus:outline-none" placeholder="****">
            <div class="flex gap-4">
                <button id="pwCancelBtn" class="flex-1 bg-gray-200 text-gray-800 py-4 rounded-xl font-bold text-xl hover:bg-gray-300 transition-colors">취소</button>
                <button id="pwSubmitBtn" class="flex-1 bg-gray-800 text-white py-4 rounded-xl font-bold text-xl hover:bg-gray-900 transition-colors">확인</button>
            </div>
        </div>
    </div>

    <!-- 사용자 정의 확인 모달 (window.confirm 대체) -->
    <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50 fade-in">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center border-t-8 border-red-500">
            <div class="text-5xl mb-4">⚠️</div>
            <h2 class="text-2xl font-black mb-4 text-gray-800">정말 진행하시겠습니까?</h2>
            <p id="confirmMessage" class="text-lg text-gray-600 mb-8 whitespace-pre-line"></p>
            <div class="flex gap-4">
                <button id="confirmCancelBtn" class="flex-1 bg-gray-200 text-gray-800 py-4 rounded-xl font-bold text-xl hover:bg-gray-300 transition-colors">취소</button>
                <button id="confirmOkBtn" class="flex-1 bg-red-600 text-white py-4 rounded-xl font-bold text-xl hover:bg-red-700 transition-colors">확인</button>
            </div>
        </div>
    </div>

    <!-- 중앙값 / 최빈값 창 -->
    <div id="statModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50 p-4 fade-in" onclick="if (event.target === this) closeStatModal()">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-y-auto p-6 sm:p-10 relative">
            <button onclick="closeStatModal()" class="absolute top-5 right-5 bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-full p-2 transition-colors" title="닫기">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div id="statModalBody"></div>
        </div>
    </div>

    <script type="module">
        // Firebase 최신 11.6.1 버전 적용 및 시스템 규칙에 맞춘 인증 연동
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, getDoc, setDoc, getDocs, writeBatch, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 환경 변수를 통한 앱 ID 및 설정 로드
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-avg-game';
        
        // 제공된 Firebase 설정을 기본값으로 사용 (환경 변수가 있으면 덮어씌움)
        const defaultConfig = {
            apiKey: "AIzaSyB8D07YFQ9C-EAjah9bV__nhVnAU94YgL4",
            authDomain: "avgerage-bd9af.firebaseapp.com",
            projectId: "avgerage-bd9af",
            storageBucket: "avgerage-bd9af.firebasestorage.app",
            messagingSenderId: "155603517696",
            appId: "1:155603517696:web:09ca46068e7978133c33e5",
            measurementId: "G-6KGE2EKM6Z"
        };
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultConfig;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 전역 상태 관리
        let currentUser = null;
        let isFirebaseReady = false;
        let isAuthenticating = true;
        
        let currentMode = 'main'; // main, join, student, teacher, quizJoin, quiz
        let currentPin = null;    // 현재 접속한 방 PIN 번호
        
        let myId = null;   
        let myName = null; 
        let myKey = null;  

        let globalGameState = { round: 1, phase: 'bidding', mode: 'avg', isGameStarted: false };
        let allStudentsData = [];
        let lastStateStr = ""; 

        // =========================================================================
        // ★ 필수 규칙 준수: 데이터를 /artifacts/{appId}/public/data/... 로 제한 ★
        // =========================================================================
        const getRoomDocRef = (pin) => doc(db, 'artifacts', appId, 'public', 'data', 'rooms', pin);
        const getStudentsColRef = (pin) => collection(db, 'artifacts', appId, 'public', 'data', 'rooms', pin, 'students');
        const getStudentDocRef = (pin, key) => doc(db, 'artifacts', appId, 'public', 'data', 'rooms', pin, 'students', key);
        const getQuizColRef = (pin) => collection(db, 'artifacts', appId, 'public', 'data', 'rooms', pin, 'quiz');
        const getQuizDocRef = (pin, key) => doc(db, 'artifacts', appId, 'public', 'data', 'rooms', pin, 'quiz', key);

        // Firebase Listener Unsubscribe Functions
        let unsubState = null;
        let unsubStudents = null;
        let unsubQuiz = null;

        // DOM Elements
        const appContainer = document.getElementById('app');
        const toastEl = document.getElementById('toast');

        function showToast(message, isError = false) {
            toastEl.textContent = message;
            toastEl.style.backgroundColor = isError ? '#ef4444' : '#111827';
            toastEl.style.opacity = '1';
            setTimeout(() => { toastEl.style.opacity = '0'; }, 3000);
        }

        let confirmCallback = null;
        function showConfirm(message, callback) {
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmModal').classList.remove('hidden');
            confirmCallback = callback;
        }

        document.getElementById('confirmCancelBtn').addEventListener('click', () => {
            document.getElementById('confirmModal').classList.add('hidden');
            confirmCallback = null;
        });

        document.getElementById('confirmOkBtn').addEventListener('click', () => {
            document.getElementById('confirmModal').classList.add('hidden');
            if (confirmCallback) confirmCallback();
            confirmCallback = null;
        });

        function renderMath() {
            if (window.renderMathInElement) {
                renderMathInElement(appContainer, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\[', right: '\\]', display: true},
                        {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        async function initFirebase() {
            renderUI(); // 로딩 화면 표시
            try {
                // 토큰 인증 또는 익명 로그인 필수 처리 (규칙 3)
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUser = auth.currentUser;
                isFirebaseReady = true;
                isAuthenticating = false;
                
                // 로그인 유지 리스너
                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                });
                
                renderUI();
            } catch (err) {
                console.error("Firebase 연결 실패:", err);
                isAuthenticating = false;
                renderUI();
                showToast("시스템 연결에 실패했습니다. 관리자에게 문의하세요.", true);
            }
        }

        function setupRoomListeners(pin) {
            if (!isFirebaseReady || !currentUser) return;

            if (unsubState) unsubState();
            if (unsubStudents) unsubStudents();

            // 방 상태 감지
            unsubState = onSnapshot(getRoomDocRef(pin), (docSnap) => {
                if (docSnap.exists()) {
                    const newState = docSnap.data();
                    if (!newState.mode) newState.mode = 'avg';
                    if (newState.isGameStarted === undefined) newState.isGameStarted = false;
                    
                    const wasGameStarted = globalGameState.isGameStarted;
                    globalGameState = newState;
                    
                    if (currentMode === 'student') {
                        if (!globalGameState.isGameStarted && globalGameState.round === 1) {
                            if (wasGameStarted) {
                                showToast("선생님이 게임을 초기화했습니다.");
                            }
                        }
                    }
                    renderUI();
                } else {
                    if (currentMode === 'student') {
                        showToast("방이 종료되었습니다.", true);
                        currentMode = 'main';
                        currentPin = null;
                        renderUI();
                    }
                }
            }, (error) => {
                console.error("State listener error:", error);
            });

            // 학생 데이터 감지 (복잡한 쿼리 없이 전체 불러오기 - 규칙 2 준수)
            unsubStudents = onSnapshot(getStudentsColRef(pin), (snapshot) => {
                const students = [];
                snapshot.forEach((docSnap) => {
                    students.push({ key: docSnap.id, ...docSnap.data() });
                });
                // JavaScript 메모리 내에서 정렬
                students.sort((a, b) => (a.studentId || '').localeCompare(b.studentId || '', 'ko'));
                allStudentsData = students;
                renderUI();
            }, (error) => {
                console.error("Students listener error:", error);
            });
        }

        // 방 입장 (학생)
        window.handleJoinRoom = async (e) => {
            e.preventDefault();
            if (!currentUser) return showToast("인증이 필요합니다.", true);

            const pinInput = document.getElementById('pinInput').value.trim();
            const idInput = document.getElementById('studentIdInput').value.trim();
            const nameInput = document.getElementById('studentNameInput').value.trim();
            
            if (!pinInput || !idInput || !nameInput) return showToast("모든 정보를 입력하세요.", true);
            
            try {
                const roomRef = getRoomDocRef(pinInput);
                const docSnap = await getDoc(roomRef);
                
                if (!docSnap.exists()) {
                    return showToast("존재하지 않는 방 번호입니다.", true);
                }

                const roomData = docSnap.data();
                const now = Date.now();
                const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
                
                if (roomData.createdAt && (now - roomData.createdAt > SEVEN_DAYS_MS)) {
                    return showToast("만료된 방입니다. (생성 후 7일 경과)", true);
                }

                currentPin = pinInput;
                myId = idInput;
                myName = nameInput;
                myKey = `${myId}_${myName}`;
                
                await setDoc(getStudentDocRef(currentPin, myKey), {
                    studentId: myId,
                    name: myName,
                    joinedAt: Date.now()
                }, { merge: true });

                currentMode = 'student';
                setupRoomListeners(currentPin);
                showToast(`${myName} 학생, 환영합니다!`);
            } catch (err) {
                console.error(err);
                showToast("방 입장에 실패했습니다.", true);
            }
        };

        window.leaveRoom = () => {
            if (unsubState) unsubState();
            if (unsubStudents) unsubStudents();
            unsubState = null; unsubStudents = null;
            currentPin = null;
            setMode('main');
        };

        window.setMode = (mode) => {
            currentMode = mode;
            renderUI();
        };

        // 교사 비밀번호
        window.openPwModal = () => {
            document.getElementById('pwModal').classList.remove('hidden');
            const pwInput = document.getElementById('pwInput');
            pwInput.value = '';
            pwValue = '';
            setTimeout(() => pwInput.focus(), 50);
        };
        const closePwModal = () => document.getElementById('pwModal').classList.add('hidden');
        document.getElementById('pwCancelBtn').addEventListener('click', closePwModal);
        
        // 방 생성 (교사)
        const tryCreateRoom = async () => {
            if (!currentUser) return showToast("인증이 필요합니다.", true);

            const pw = pwValue;
            if (pw === '13579') {
                closePwModal();
                showToast("방을 생성하는 중입니다...");
                
                let newPin = null;
                let attempts = 0;
                const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
                const now = Date.now();
                
                try {
                    while (attempts < 10) {
                        const candidatePin = String(Math.floor(10000 + Math.random() * 90000));
                        const roomRef = getRoomDocRef(candidatePin);
                        const roomSnap = await getDoc(roomRef);

                        if (!roomSnap.exists()) {
                            newPin = candidatePin;
                            break;
                        } else {
                            const roomData = roomSnap.data();
                            if (roomData.createdAt && (now - roomData.createdAt > SEVEN_DAYS_MS)) {
                                // 기존 데이터 삭제
                                const studentsSnap = await getDocs(getStudentsColRef(candidatePin));
                                const batch = writeBatch(db);
                                studentsSnap.forEach(doc => {
                                    batch.delete(doc.ref);
                                });
                                const quizSnap = await getDocs(getQuizColRef(candidatePin));
                                quizSnap.forEach(doc => batch.delete(doc.ref));
                                await batch.commit();
                                
                                newPin = candidatePin;
                                break;
                            }
                        }
                        attempts++;
                    }

                    if (!newPin) {
                        showToast("방을 생성할 수 없습니다. 잠시 후 다시 시도해주세요.", true);
                        return;
                    }

                    await setDoc(getRoomDocRef(newPin), {
                        round: 1, 
                        phase: 'bidding', 
                        mode: 'avg', 
                        isGameStarted: false,
                        createdAt: now
                    });
                    
                    currentPin = newPin;
                    currentMode = 'teacher';
                    setupRoomListeners(currentPin);
                    showToast(`방(${newPin})이 생성되었습니다.`);
                } catch (err) {
                    console.error(err);
                    showToast("방 생성에 실패했습니다.", true);
                }

            } else {
                showToast("비밀번호가 틀렸습니다.", true);
                document.getElementById('pwInput').value = '';
                pwValue = '';
                document.getElementById('pwInput').focus();
            }
        };
        document.getElementById('pwSubmitBtn').addEventListener('click', tryCreateRoom);
        
        let pwValue = '';
        document.getElementById('pwInput').addEventListener('input', (e) => {
            const el = e.target;
            const shown = el.value;
            const kept = (shown.match(/●/g) || []).length;
            const added = shown.replace(/●/g, '').replace(/\s/g, '');
            pwValue = pwValue.slice(0, kept) + added;
            el.value = '●'.repeat(pwValue.length);
        });
        document.getElementById('pwInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') tryCreateRoom(); });

        window.handleBidSubmit = async (e) => {
            e.preventDefault();
            if (!currentUser || !currentPin) return;

            const bidInput = parseInt(document.getElementById('bidInput').value, 10);
            
            if (isNaN(bidInput) || bidInput < 0 || bidInput > 100) {
                return showToast("0부터 100 사이의 정수만 입력 가능합니다.", true);
            }

            const me = allStudentsData.find(s => s.key === myKey) || {};
            const existingBids = me.submissions || {};
            const newBids = { ...existingBids, [globalGameState.round]: bidInput };

            try {
                await setDoc(getStudentDocRef(currentPin, myKey), { submissions: newBids }, { merge: true });
                showToast("제출이 완료되었습니다!");
            } catch (err) {
                console.error(err);
                showToast("제출 중 오류가 발생했습니다.", true);
            }
        };

        let isCountingDown = false;
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        function fireConfetti() {
            if (typeof window.confetti !== 'function') return;
            const colors = ['#2554c7', '#d9473b', '#ffe36e', '#2f7d5b', '#ffffff'];
            const base = { colors, disableForReducedMotion: true, zIndex: 100 };
            window.confetti({ ...base, particleCount: 160, spread: 100, startVelocity: 55, origin: { x: 0.5, y: 0.55 } });
            const end = Date.now() + 2500;
            (function frame() {
                window.confetti({ ...base, particleCount: 6, angle: 60, spread: 60, origin: { x: 0, y: 0.7 } });
                window.confetti({ ...base, particleCount: 6, angle: 120, spread: 60, origin: { x: 1, y: 0.7 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            })();
        }

        window.handleRevealResults = async () => {
            if (!currentUser || !currentPin || isCountingDown) return;
            isCountingDown = true;

            const overlay = document.createElement('div');
            overlay.className = 'countdown-overlay';
            document.body.appendChild(overlay);
            try {
                for (let n = 5; n >= 1; n--) {
                    overlay.innerHTML = `<div class="countdown-label">결과 공개까지</div><div class="countdown-num" key="${n}">${n}</div>`;
                    await sleep(1000);
                }
                overlay.remove();
                await setDoc(getRoomDocRef(currentPin), { ...globalGameState, phase: 'revealed' }, { merge: true });
                fireConfetti();
                showToast("결과가 학생 화면에 공개되었습니다.");
            } catch (err) {
                console.error(err);
                overlay.remove();
                showToast("결과 공개 중 오류가 발생했습니다.", true);
            } finally {
                isCountingDown = false;
            }
        };

        window.handleNextRound = async () => {
            if (!currentUser || !currentPin) return;
            await setDoc(getRoomDocRef(currentPin), { 
                round: globalGameState.round + 1, 
                phase: 'bidding', 
                mode: globalGameState.mode, 
                isGameStarted: true 
            }, { merge: true });
            showToast("다음 라운드를 시작합니다.");
        };

        window.handleStartGame = async () => {
            if (!currentUser || !currentPin) return;
            await setDoc(getRoomDocRef(currentPin), { ...globalGameState, isGameStarted: true }, { merge: true });
            showToast("학생들이 입장을 시작할 수 있습니다.");
        };

        window.handleSetMode = async (newMode) => {
            if (!currentUser || !currentPin) return;
            await setDoc(getRoomDocRef(currentPin), { ...globalGameState, mode: newMode }, { merge: true });
            showToast("게임 모드가 변경되었습니다.");
        };

        // ===== 중앙값 / 최빈값 처리 =====
        function getRoundValues() {
            const round = globalGameState.round;
            return allStudentsData
                .map(s => (s.submissions || {})[round])
                .filter(v => v !== undefined && v !== null)
                .map(Number)
                .sort((a, b) => a - b);
        }
        const fmt = (x) => Number.isInteger(x) ? String(x) : (Math.round(x * 10) / 10).toFixed(1);

        function openStatModal(html) {
            document.getElementById('statModalBody').innerHTML = html;
            document.getElementById('statModal').classList.remove('hidden');
        }
        window.closeStatModal = () => {
            document.getElementById('statModal').classList.add('hidden');
            if (typeof unsubQuiz === 'function' && unsubQuiz) { unsubQuiz(); unsubQuiz = null; }
        };
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.closeStatModal(); });

        const emptyMsg = `<div class="text-center text-gray-400 text-2xl py-16">제출된 값이 없습니다.</div>`;

        window.showMedian = () => {
            const vals = getRoundValues();
            const n = vals.length;
            let body = '';
            if (n === 0) {
                body = emptyMsg;
            } else {
                const isOdd = n % 2 === 1;
                const midIdx = isOdd ? [(n - 1) / 2] : [n / 2 - 1, n / 2];
                const median = isOdd ? vals[midIdx[0]] : (vals[midIdx[0]] + vals[midIdx[1]]) / 2;

                const chips = vals.map((v, i) => {
                    const hit = midIdx.includes(i);
                    return `
                        <div class="flex flex-col items-center">
                            <div class="${hit ? 'bg-orange-500 text-white border-orange-500 scale-110 shadow-lg' : 'bg-gray-50 text-gray-800 border-gray-200'} border-2 rounded-xl w-14 h-14 sm:w-16 sm:h-16 flex items-center justify-center text-2xl font-black transition-transform">${v}</div>
                            <div class="text-xs mt-1 ${hit ? 'text-orange-600 font-bold' : 'text-gray-400'}">${i + 1}번째</div>
                        </div>`;
                }).join('');

                const explain = isOdd
                    ? `자료가 <b>${n}개(홀수)</b>이므로 한가운데인 <b>${midIdx[0] + 1}번째 값</b>이 중앙값이에요.`
                    : `자료가 <b>${n}개(짝수)</b>이므로 가운데 두 값 <b>${midIdx[0] + 1}번째(${vals[midIdx[0]]})</b>와 <b>${midIdx[1] + 1}번째(${vals[midIdx[1]]})</b>의 평균이 중앙값이에요.`;
                const calc = isOdd ? '' : `<div class="text-xl text-gray-600 mt-2">(${vals[midIdx[0]]} + ${vals[midIdx[1]]}) ÷ 2 = ${fmt(median)}</div>`;

                body = `
                    <p class="text-lg text-gray-500 mb-6">제출한 값을 <b>작은 값부터 큰 값</b> 순서로 나열했어요.</p>
                    <div class="flex flex-wrap gap-3 justify-center mb-8">${chips}</div>
                    <div class="bg-orange-50 border-2 border-orange-200 rounded-2xl p-6 text-center">
                        <div class="text-lg text-gray-700 break-keep">${explain}</div>
                        ${calc}
                        <div class="mt-4 text-2xl font-bold text-gray-700">중앙값 = <span class="text-6xl font-black text-orange-600 align-middle">${fmt(median)}</span></div>
                    </div>`;
            }
            openStatModal(`<h2 class="text-4xl font-black text-gray-800 mb-2">중앙값</h2>${body}`);
        };

        window.showMode = () => {
            const vals = getRoundValues();
            const n = vals.length;
            let body = '';
            if (n === 0) {
                body = emptyMsg;
            } else {
                const counts = new Map();
                vals.forEach(v => counts.set(v, (counts.get(v) || 0) + 1));
                const entries = [...counts.entries()].sort((a, b) => a[0] - b[0]);
                const maxCount = Math.max(...entries.map(e => e[1]));
                const allSame = entries.length > 1 && entries.every(e => e[1] === maxCount);
                const modes = allSame ? [] : entries.filter(e => e[1] === maxCount).map(e => e[0]);

                const rows = entries.map(([v, c]) => {
                    const hit = modes.includes(v);
                    const dots = Array.from({ length: c }, () => `<span class="inline-block w-5 h-5 rounded-full ${hit ? 'bg-orange-500' : 'bg-blue-400'}"></span>`).join('');
                    return `
                        <tr class="${hit ? 'bg-orange-50' : ''}">
                            <td class="py-2 pr-4 text-right text-2xl font-black ${hit ? 'text-orange-600' : 'text-gray-800'} w-20">${v}</td>
                            <td class="py-2"><div class="flex flex-wrap gap-1.5">${dots}</div></td>
                            <td class="py-2 pl-4 text-right text-xl font-bold ${hit ? 'text-orange-600' : 'text-gray-500'} w-20 whitespace-nowrap">${c}개</td>
                        </tr>`;
                }).join('');

                let result = '';
                if (allSame) {
                    result = `<div class="text-2xl font-bold text-gray-700">모든 값이 똑같이 <b>${maxCount}개</b>씩 나왔어요.<br><span class="text-4xl font-black text-orange-600">최빈값이 없습니다</span></div>`;
                } else {
                    result = `
                        <div class="text-lg text-gray-700">가장 많이 나온 값 <b>(${maxCount}개)</b></div>
                        <div class="mt-2 text-2xl font-bold text-gray-700">최빈값 = <span class="text-6xl font-black text-orange-600 align-middle">${modes.join(', ')}</span></div>`;
                }

                body = `
                    <p class="text-lg text-gray-500 mb-6">값을 <b>작은 값부터 큰 값</b> 순서로 놓고, 각 값이 나온 개수를 세었어요. (전체 ${n}개)</p>
                    <table class="w-full mb-8 border-separate" style="border-spacing:0 4px"><tbody>${rows}</tbody></table>
                    <div class="bg-orange-50 border-2 border-orange-200 rounded-2xl p-6 text-center">${result}</div>`;
            }
            openStatModal(`<h2 class="text-4xl font-black text-gray-800 mb-2">최빈값</h2>${body}`);
        };

        window.handleResetGame = () => {
            if (!currentUser || !currentPin) return;
            showConfirm("이 방의 모든 학생 데이터가 삭제되고 1라운드로 돌아갑니다.\n초기화 하시겠습니까?", async () => {
                try {
                    await setDoc(getRoomDocRef(currentPin), { round: 1, phase: 'bidding', mode: 'avg', isGameStarted: false }, { merge: true });
                    const batch = writeBatch(db);
                    allStudentsData.forEach(student => {
                        batch.delete(getStudentDocRef(currentPin, student.key));
                    });
                    await batch.commit();
                    showToast("모든 데이터가 삭제되고 초기화되었습니다.");
                } catch (err) {
                    console.error(err);
                    showToast("초기화 중 오류가 발생했습니다.", true);
                }
            });
        };

        window.calcState = { currentValue: '0', previousValue: null, operator: null, waitingForNewValue: false, isVisible: false };
        window.teacherState = { isModeVisible: false, extras: [] };

        // ===== 분포 그래프 + 극단값 체험 =====
        function calcStats(vals) {
            const s = [...vals].sort((a, b) => a - b);
            const n = s.length;
            if (n === 0) return null;
            const mean = s.reduce((t, v) => t + v, 0) / n;
            const median = n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
            const cnt = new Map();
            s.forEach(v => cnt.set(v, (cnt.get(v) || 0) + 1));
            const entries = [...cnt.entries()];
            const mx = Math.max(...entries.map(e => e[1]));
            const allSame = entries.length > 1 && entries.every(e => e[1] === mx);
            const modes = allSame ? [] : entries.filter(e => e[1] === mx).map(e => e[0]);
            return { n, mean, median, modes, modeCount: mx, sorted: s };
        }

        window.addExtraValue = (e, preset) => {
            if (e) e.preventDefault();
            let v = preset;
            if (v === undefined) {
                const el = document.getElementById('extraInput');
                v = parseInt(el ? el.value : '', 10);
                if (el) el.value = '';
            }
            if (isNaN(v) || v < 0 || v > 100) return showToast("0부터 100 사이의 정수를 입력하세요.", true);
            window.teacherState.extras = [...window.teacherState.extras, v];
            renderUI();
        };
        window.clearExtraValues = () => { window.teacherState.extras = []; renderUI(); };

        function getDistributionPanel(baseVals) {
            const extras = window.teacherState.extras;
            const allVals = [...baseVals, ...extras];
            const before = calcStats(baseVals);
            const now = calcStats(allVals);
            if (!now) return '';

            const C = { mean: '#2554c7', median: '#ea580c', mode: '#16a34a', extra: '#d9473b', dot: '#94a3b8' };

            const minV = Math.min(...allVals), maxV = Math.max(...allVals);
            let lo = Math.max(0, Math.floor((minV - 2) / 10) * 10);
            let hi = Math.min(100, Math.ceil((maxV + 2) / 10) * 10);
            if (hi - lo < 10) { hi = Math.min(100, lo + 10); lo = Math.max(0, hi - 10); }
            const range = hi - lo;
            const tickStep = range <= 20 ? 1 : range <= 50 ? 5 : 10;
            const labelStep = range <= 20 ? 2 : range <= 50 ? 5 : 10;

            const W = 1000, padL = 40, padR = 40, plotW = W - padL - padR;
            const x = (v) => padL + (v - lo) / range * plotW;
            const unit = plotW / range;
            const r = Math.max(6, Math.min(16, unit * 0.42));
            const gap = 2 * r + 3;

            const stack = new Map();
            const dots = [];
            baseVals.forEach(v => { const k = stack.get(v) || 0; stack.set(v, k + 1); dots.push({ v, k, extra: false }); });
            extras.forEach(v => { const k = stack.get(v) || 0; stack.set(v, k + 1); dots.push({ v, k, extra: true }); });
            const maxStack = Math.max(...stack.values());

            const labelRows = 3, rowH = 30, topPad = 12;
            const labelsH = topPad + labelRows * rowH;
            const stackH = Math.max(maxStack * gap + 20, 80);
            const axisY = labelsH + stackH;
            const H = axisY + 46;

            let ticks = '';
            for (let t = lo; t <= hi; t += tickStep) {
                const isLabel = (t - lo) % labelStep === 0;
                ticks += `<line x1="${x(t)}" y1="${axisY}" x2="${x(t)}" y2="${axisY + (isLabel ? 10 : 5)}" stroke="#64748b" stroke-width="1.5"/>`;
                if (isLabel) ticks += `<text x="${x(t)}" y="${axisY + 32}" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">${t}</text>`;
            }

            const dotsSVG = dots.map(d => `<circle cx="${x(d.v)}" cy="${axisY - r - 4 - d.k * gap}" r="${r}" fill="${d.extra ? C.extra : C.dot}" ${d.extra ? `stroke="#fff" stroke-width="2"` : ''}/>`).join('');

            const line = (v, color, row, label) => {
                const ly = topPad + row * rowH + 20;
                const lx = Math.min(Math.max(x(v), padL + 60), W - padR - 60);
                return `
                    <line x1="${x(v)}" y1="${ly + 6}" x2="${x(v)}" y2="${axisY}" stroke="${color}" stroke-width="3" stroke-dasharray="${row === 0 ? '0' : row === 1 ? '8 5' : '3 4'}"/>
                    <text x="${lx}" y="${ly}" text-anchor="middle" font-size="20" font-weight="900" fill="${color}" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">${label}</text>`;
            };
            let markers = line(now.mean, C.mean, 0, `평균 ${fmt(now.mean)}`) + line(now.median, C.median, 1, `중앙값 ${fmt(now.median)}`);
            now.modes.slice(0, 4).forEach((m, i) => { markers += line(m, C.mode, 2, i === 0 ? `최빈값 ${now.modes.join(', ')}` : ''); });

            const svg = `
                <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="제출값 분포 그래프">
                    <line x1="${padL}" y1="${axisY}" x2="${W - padR}" y2="${axisY}" stroke="#334155" stroke-width="2"/>
                    ${ticks}
                    ${dotsSVG}
                    ${markers}
                </svg>`;

            const hasExtra = extras.length > 0 && before;
            const modeStr = (st) => st.modes.length ? st.modes.join(', ') : '없음';
            const card = (name, color, beforeVal, nowVal, numBefore, numNow) => {
                const moved = hasExtra && numBefore !== null ? Math.abs(numNow - numBefore) : null;
                return `
                    <div class="rounded-2xl p-4 text-center border-2" style="border-color:${color}33;background:${color}0d">
                        <div class="font-bold text-sm" style="color:${color}">${name}</div>
                        ${hasExtra ? `
                            <div class="text-lg text-gray-400 font-bold mt-1">${beforeVal} →</div>
                            <div class="text-4xl font-black" style="color:${color}">${nowVal}</div>
                            ${moved !== null ? `<div class="text-sm font-bold mt-1 ${moved >= 3 ? 'text-red-600' : 'text-gray-500'}">${moved < 0.05 ? '변화 없음' : `${fmt(moved)}만큼 이동`}</div>` : ''}
                        ` : `<div class="text-4xl font-black mt-1" style="color:${color}">${nowVal}</div>`}
                    </div>`;
            };
            const cards = `
                <div class="grid grid-cols-3 gap-3">
                    ${card('평균', C.mean, before ? fmt(before.mean) : '-', fmt(now.mean), before ? before.mean : null, now.mean)}
                    ${card('중앙값', C.median, before ? fmt(before.median) : '-', fmt(now.median), before ? before.median : null, now.median)}
                    ${card('최빈값', C.mode, before ? modeStr(before) : '-', modeStr(now), null, null)}
                </div>`;

            const extraChips = extras.map(v => `<span class="inline-flex items-center justify-center min-w-[2.5rem] px-2 py-1 rounded-lg bg-red-50 text-red-600 font-black border border-red-200">${v}</span>`).join('');

            return `
                <div class="bg-white rounded-3xl shadow-xl border border-gray-200 p-6 sm:p-8 mb-8">
                    <div class="flex flex-wrap items-baseline justify-between gap-2 mb-2">
                        <h3 class="text-2xl font-black text-gray-800">제출값 분포와 대표값</h3>
                        <div class="text-gray-500 font-bold">자료 ${now.n}개${extras.length ? ` <span class="text-red-600">(극단값 ${extras.length}개 포함)</span>` : ''}</div>
                    </div>
                    <div class="flex flex-wrap gap-4 text-sm font-bold text-gray-500 mb-2">
                        <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-full" style="background:${C.dot}"></span>학생 제출값</span>
                        ${extras.length ? `<span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-full" style="background:${C.extra}"></span>선생님이 넣은 값</span>` : ''}
                        <span style="color:${C.mean}">━ 평균</span>
                        <span style="color:${C.median}">╍ 중앙값</span>
                        <span style="color:${C.mode}">┅ 최빈값</span>
                    </div>
                    ${svg}
                    <div class="mt-6 grid lg:grid-cols-5 gap-6 items-start">
                        <div class="lg:col-span-3">${cards}</div>
                        <div class="lg:col-span-2 bg-slate-50 rounded-2xl p-4 border border-slate-200">
                            <div class="font-black text-gray-800 mb-1">극단값 체험</div>
                            <p class="text-sm text-gray-500 mb-3 break-keep">아주 크거나 작은 값을 넣으면 대표값이 어떻게 변할까요? <span class="text-gray-400">(그래프에서만 계산되고 순위에는 영향 없어요)</span></p>
                            <div class="flex gap-2 mb-2">
                                <button onclick="addExtraValue(null, 100)" class="flex-1 bg-white hover:bg-red-50 border-2 border-red-300 text-red-600 font-black py-2 rounded-xl">100 넣기</button>
                                <button onclick="addExtraValue(null, 0)" class="flex-1 bg-white hover:bg-red-50 border-2 border-red-300 text-red-600 font-black py-2 rounded-xl">0 넣기</button>
                            </div>
                            <form onsubmit="addExtraValue(event)" class="flex gap-2">
                                <input id="extraInput" type="number" min="0" max="100" placeholder="직접 입력" class="flex-1 min-w-0 px-3 py-2 border-2 border-gray-300 rounded-xl text-lg font-bold text-center focus:outline-none focus:border-red-400">
                                <button type="submit" class="bg-red-500 hover:bg-red-600 text-white font-black px-4 rounded-xl">넣기</button>
                            </form>
                            ${extras.length ? `
                                <div class="flex flex-wrap items-center gap-2 mt-3">${extraChips}

        window.handleCalcBtn = (val) => {
            let { currentValue, previousValue, operator, waitingForNewValue } = window.calcState;
            const display = document.getElementById('calcDisplay');
            if (['+', '-', '*', '/'].includes(val)) {
                if (operator && !waitingForNewValue) currentValue = calculateResult(previousValue, currentValue, operator);
                window.calcState.previousValue = currentValue; window.calcState.operator = val; window.calcState.waitingForNewValue = true;
            } else if (val === '=') {
                if (operator && previousValue !== null) {
                    currentValue = calculateResult(previousValue, currentValue, operator);
                    window.calcState.previousValue = null; window.calcState.operator = null; window.calcState.waitingForNewValue = true;
                }
            } else if (val === 'C') {
                currentValue = '0'; window.calcState.previousValue = null; window.calcState.operator = null; window.calcState.waitingForNewValue = false;
            } else {
                if (waitingForNewValue) { currentValue = val === '.' ? '0.' : val; window.calcState.waitingForNewValue = false; }
                else {
                    if (currentValue === '0' && val !== '.') currentValue = val;
                    else if (val === '.' && currentValue.includes('.')) {}
                    else currentValue += val;
                }
            }
            if (currentValue.length > 12) currentValue = currentValue.substring(0, 12);
            window.calcState.currentValue = String(currentValue);
            if (display) display.textContent = window.calcState.currentValue;

        function calculateResult(a, b, op) {
            const numA = parseFloat(a), numB = parseFloat(b); let res = 0;
            switch(op) { case '+': res = numA+numB; break; case '-': res = numA-numB; break; case '*': res = numA*numB; break; case '/': res = numB===0?0:numA/numB; break; }
            return String(Math.round(res * 10000) / 10000);
        }

        // ===== 형성평가 로직 =====
        const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
        const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
        const pickDistinct = (k, lo = 1, hi = 20, exclude = []) => shuffle(Array.from({ length: hi - lo + 1 }, (_, i) => i + lo).filter(v => !exclude.includes(v))).slice(0, k);
        const nfmt = (x) => Number.isInteger(x) ? String(x) : String(Math.round(x * 100) / 100);

        function makeMeanQ() {
            const n = rint(3, 5); let data;
            do { data = Array.from({ length: n }, () => rint(1, 20)); } while (data.reduce((s, v) => s + v, 0) % n !== 0);
            const sum = data.reduce((s, v) => s + v, 0);
            return { key: 'mean', kind: 'num', topic: '평균', title: `평균 구하기 (변량 ${n}개)`, data, answer: sum / n,
                ask: '다음 자료의 <b>평균</b>을 구하세요.', explain: `(${data.join(' + ')}) ÷ ${n} = ${sum} ÷ ${n} = <b>${sum / n}</b>` };
        }
        function makeMedianQ(n) {
            const data = Array.from({ length: n }, () => rint(1, 20)).sort((a, b) => a - b);
            const odd = n % 2 === 1; const idx = odd ? [(n - 1) / 2] : [n / 2 - 1, n / 2];
            const ans = odd ? data[idx[0]] : (data[idx[0]] + data[idx[1]]) / 2;
            const sortedHTML = data.map((v, i) => idx.includes(i) ? `<span class="qhit">${v}</span>` : v).join(', ');
            const explain = odd ? `작은 값부터 나열: ${sortedHTML}<br>자료가 ${n}개(홀수)이므로 ${idx[0] + 1}번째 값 → 중앙값 <b>${ans}</b>`
                : `작은 값부터 나열: ${sortedHTML}<br>자료가 ${n}개(짝수)이므로 ${idx[0] + 1}번째와 ${idx[1] + 1}번째 값의 평균<br>(${data[idx[0]]} + ${data[idx[1]]}) ÷ 2 = <b>${nfmt(ans)}</b>`;
            return { key: odd ? 'med7' : 'med10', kind: 'num', topic: '중앙값', title: `중앙값 구하기 (자료 ${n}개, ${odd ? '홀수' : '짝수'})`, data, answer: ans, ask: '다음 자료의 <b>중앙값</b>을 구하세요.', explain };
        }
        function modeExplain(data) {
            const cnt = new Map(); data.forEach(v => cnt.set(v, (cnt.get(v) || 0) + 1));
            const entries = [...cnt.entries()].sort((a, b) => a[0] - b[0]);
            const mx = Math.max(...entries.map(e => e[1]));
            const none = entries.every(e => e[1] === mx);
            const modes = none ? [] : entries.filter(e => e[1] === mx).map(e => e[0]);
            const table = entries.map(([v, c]) => `<span class="${modes.includes(v) ? 'qhit' : ''}">${v}(${c}개)</span>`).join(' · ');
            const tail = none ? (mx === 1 ? '모든 값이 1개씩 → <b>최빈값 없음</b>' : `모든 값이 ${mx}개씩으로 같음 → <b>최빈값 없음</b>`) : `가장 많이 나온 값(${mx}개) → 최빈값 <b>${modes.join(', ')}</b>`;
            return { modes, explain: `값별 개수: ${table}<br>${tail}` };
        }
        function makeModeQ(type) {
            let data, title;
            if (type === 'none') { title = '최빈값 구하기'; if (Math.random() < 0.5) data = pickDistinct(7); else data = pickDistinct(4).flatMap(v => [v, v]); }
            else if (type === 'one') { title = '최빈값 구하기'; const [m, ...rest] = pickDistinct(6); data = [m, m, m, rest[0], rest[0], rest[1], rest[2], rest[3], rest[4]]; }
            else { title = '최빈값 구하기'; const multi = Math.random() < 0.5 ? 2 : 3; const vals = pickDistinct(multi + 3); data = [...vals.slice(0, multi).flatMap(v => [v, v, v]), ...vals.slice(multi)]; }
            data = shuffle(data); const { modes, explain } = modeExplain(data);
            return { key: 'mode_' + type, kind: 'mode', topic: '최빈값', title, data, answer: modes, ask: '다음 자료의 <b>최빈값</b>을 구하세요. (2개 이상이면 모두 쓰고, 없으면 [최빈값 없음]을 누르세요.)', explain };
        }
        function buildQuiz() { return [makeMeanQ(), makeMedianQ(7), makeMedianQ(10), ...shuffle([makeModeQ('none'), makeModeQ('one'), makeModeQ('multi')])]; }

        window.downloadQuizCSV = () => {

        function parseNums(str) { return (str || '').split(/[,\s/·]+/).map(t => t.trim()).filter(Boolean).map(Number); }
        
        window.gradeQuiz = () => {
            const qs = window.quizState.questions;

            if (blank !== -1) { showToast(`${blank + 1}번 문제의 답을 입력하세요.`, true); document.getElementById(`qa${blank}`).focus(); return; }
            answers.forEach((a, i) => {
                const q = qs[i];

                                <span class="text-white text-4xl font-black tracking-[0.2em]">${currentPin}</span>
                            </div>
                            <h2 class="text-2xl sm:text-3xl font-black tracking-tight">제 ${currentRound} 라운드 <span class="text-slate-400 font-medium ml-2 text-xl">접속: ${allStudentsData.length}명</span></h2>
                        </div>
                        <div class="flex items-center gap-2 bg-slate-800 p-2 rounded-xl transition-all">
                            <button onclick="toggleModeVisibility()" class="text-slate-400 hover:text-white transition-colors px-1 flex items-center" title="진행 모드 숨기기/보이기">
                                ${window.teacherState.isModeVisible ? '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>'}
                            </button>
                            ${window.teacherState.isModeVisible ? `
                                <button onclick="handleSetMode('avg')" class="px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${globalGameState.mode === 'avg' ? 'bg-blue-500 text-white shadow-md' : 'text-slate-300 hover:bg-slate-700 hover:text-white'}">평균</button>
                                <button onclick="handleSetMode('avg_plus_5')" class="px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${globalGameState.mode === 'avg_plus_5' ? 'bg-blue-500 text-white shadow-md' : 'text-slate-300 hover:bg-slate-700 hover:text-white'}">평균 + 5</button>
                                <button onclick="handleSetMode('avg_2_3')" class="px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${globalGameState.mode === 'avg_2_3' ? 'bg-blue-500 text-white shadow-md' : 'text-slate-300 hover:bg-slate-700 hover:text-white'}">평균 2/3</button>
                            ` : `<span class="px-3 py-1.5 rounded-lg text-sm font-bold text-slate-500 tracking-[0.2em] w-20 text-center">***</span>`}
                        </div>
                        <div class="flex flex-wrap justify-center gap-3">
                            ${!isRevealed 
                                ? `<button onclick="handleRevealResults()" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-black py-3 px-6 rounded-xl text-lg shadow-lg flex items-center gap-2 transition-transform transform hover:scale-105"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg> 결과 공개</button>`
                                : `<button onclick="handleNextRound()" class="bg-green-500 hover:bg-green-600 text-white font-black py-3 px-6 rounded-xl text-lg shadow-lg flex items-center gap-2 transition-transform transform hover:scale-105">새 라운드 시작 <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg></button>`
                            }
                            <button onclick="handleResetGame()" class="bg-slate-700 hover:bg-red-600 text-slate-300 hover:text-white font-bold py-3 px-4 rounded-xl text-base shadow-md transition-colors border border-slate-600 hover:border-red-500">초기화</button>
                            ${isRevealed ? `<button onclick="showMedian()" class="bg-white hover:bg-orange-50 text-slate-900 font-black py-3 px-5 rounded-xl text-lg shadow-md transition-colors border-2 border-orange-300">중앙값</button><button onclick="showMode()" class="bg-white hover:bg-orange-50 text-slate-900 font-black py-3 px-5 rounded-xl text-lg shadow-md transition-colors border-2 border-orange-300">최빈값</button>` : ''}
                            <button onclick="showQuizResults()" class="bg-yellow-300 hover:bg-yellow-400 text-slate-900 font-black py-3 px-4 rounded-xl text-base shadow-md transition-colors border-2 border-yellow-500">형성평가 결과</button>
                        </div>
                    </div>
                    ${boardHTML}
                </div>
            `;
        }

        function getStudentViewState() {
            const me = allStudentsData.find(s => s.key === myKey) || { submissions: {} };
            const hasSubmitted = (me.submissions || {})[globalGameState.round] !== undefined;
            return JSON.stringify({ pin: currentPin, round: globalGameState.round, phase: globalGameState.phase, hasSubmitted: hasSubmitted, calcVisible: window.calcState.isVisible, mode: globalGameState.mode, myName: myName, myId: myId });
        }

        function renderUI() {
            let html = '';
            let currentStateStr = "";
            
            if (isAuthenticating) { html = getLoadingView(); currentStateStr = "loading"; }
            else if (currentMode === 'main') { html = getMainView(); currentStateStr = "main"; }
            else if (currentMode === 'quizJoin') { html = getQuizJoinView(); currentStateStr = "quizJoin"; }
            else if (currentMode === 'quiz') { html = getQuizView(); currentStateStr = "quiz_" + window.quizState.version + "_" + window.quizState.graded; }
            else if (currentMode === 'join') { html = getJoinView(); currentStateStr = "join"; }
            else if (currentMode === 'student') { currentStateStr = "student_" + getStudentViewState(); html = getStudentView(); }
            else if (currentMode === 'teacher') { currentStateStr = "teacher_" + currentPin + "_" + JSON.stringify(globalGameState) + "_" + JSON.stringify(allStudentsData) + "_" + JSON.stringify(window.teacherState); html = getTeacherView(); }

            if (lastStateStr === currentStateStr) return;
            lastStateStr = currentStateStr;

            let activeId = null; let activeVal = null; let cursorStart = null; let cursorEnd = null;
            if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                activeId = document.activeElement.id; activeVal = document.activeElement.value;
                try { cursorStart = document.activeElement.selectionStart; cursorEnd = document.activeElement.selectionEnd; } catch(e) {}
            }

            appContainer.innerHTML = html;

            if (activeId) {
                const el = document.getElementById(activeId);
                if (el) {
                    el.value = activeVal; el.focus();
                    try { if (cursorStart !== null && cursorEnd !== null) el.setSelectionRange(cursorStart, cursorEnd); } catch(e) {}
                }
            }
            setTimeout(renderMath, 10);
        }

        window.onload = () => {
            initFirebase();
        };
    </script>
</body>
</html>
